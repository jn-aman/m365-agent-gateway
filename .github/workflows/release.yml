name: Release
# Run from main to bump the version, tag, and publish. Run from (or push) a vX.Y.Z tag to publish that tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (used when run from main)
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    # The bump run checks main; the tag run it dispatches publishes without repeating them.
    if: github.ref_type == 'branch' || github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  bump:
    needs: checks
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::Run the release from $DEFAULT_BRANCH"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.26'
      - name: Bump version, commit, tag, push
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(uv version --short)
          uv version --bump "$BUMP" --frozen
          new=$(uv version --short)
          # Edit only this package's entry so the bump never re-resolves the lock.
          sed -i "/^name = \"m365-agent-gateway\"\$/{n;s/^version = \"$old\"\$/version = \"$new\"/}" uv.lock
          grep -A1 '^name = "m365-agent-gateway"$' uv.lock | grep -qx "version = \"$new\""
          uv lock --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release v$new"
          git tag -a "v$new" -m "v$new"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$new"
          # Tags pushed with GITHUB_TOKEN do not trigger workflows, so start the publish run explicitly.
          gh workflow run release.yml --ref "v$new"
          echo "Started publish run for v$new" >> "$GITHUB_STEP_SUMMARY"
  image:
    needs: checks
    if: github.ref_type == 'tag' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  github-release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`"
